name: Vector playback tests

on:
  push:
    branches: [master, vector-animations, integrate/vector-upstream-20261110]
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'rc/**'
      - 'man/**'
      - 'demo/**'
      - 'VECTOR_ANIMATIONS.md'
      - 'LICENSE.txt'
      - 'tests/vector/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/vector-tests.yml'

permissions:
  contents: read

jobs:
  native-vector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build valac pkg-config libgtk-3-dev libpoppler-glib-dev libgee-0.8-dev libjson-glib-dev dbus-x11 xvfb xdotool imagemagick python3-pil python3-pypdf python3-reportlab poppler-utils groff
      - name: Build native viewer and shared renderer probe
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMOVIES=OFF -DMDVIEW=OFF -DREST=OFF
          cmake --build build --parallel 2
      - name: Required renderer and real-GUI regression tests
        run: |
          python3 -B tests/vector/test_ci_tests.py
          python3 -B tests/vector/ci_tests.py build
      - name: Installed manuals, guide, license and runnable example
        run: |
          DESTDIR="$PWD/build/install-check" cmake --install build
          python3 -B tests/vector/test_install.py build/bin/vector-probe \
            --prefix "$PWD/build/install-check/usr" \
            --output "$PWD/build/tests/vector/installed" -v
